services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_DB: keycloak, POSTGRES_USER: orbita, POSTGRES_PASSWORD: orbita_local }
    ports: ['5432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: orbita, MINIO_ROOT_PASSWORD: orbita_local_storage }
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio_data:/data']
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      {
        KC_BOOTSTRAP_ADMIN_USERNAME: admin,
        KC_BOOTSTRAP_ADMIN_PASSWORD: admin_local,
        KC_DB: postgres,
        KC_DB_URL_HOST: postgres,
        KC_DB_URL_DATABASE: keycloak,
        KC_DB_USERNAME: orbita,
        KC_DB_PASSWORD: orbita_local,
        KC_HEALTH_ENABLED: 'true',
      }
    ports: ['8180:8080']
    volumes: ['./infra/keycloak:/opt/keycloak/data/import:ro']
    depends_on: [postgres]
volumes: { postgres_data: {}, minio_data: {} }
